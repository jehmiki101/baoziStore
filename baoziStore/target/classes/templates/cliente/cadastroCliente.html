<!DOCTYPE html>
	<html xmlns:th="http://www.thymeleaf.org">
	
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de Cliente</title>
		<!--  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">-->
		<!-- Bootstrap core CSS -->
		<link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
			
		<link rel="stylesheet" type="text/css" media="all" href="../../css/style.css"  />
	</head>
	<body>
		<div th:replace="fragments/alert"></div>
		<form th:action="${cliente.id} == null" ? @{/cadastroCliente/salvar} : @{cadastroCliente/listar}
			th:objecto = "${cliente}" method = "POST">   
			
			<input type="hidden"  th:field="*{id}"> 
	
			<div class="mb-3">
			    <label for="exampleInputCliente" class="form-label">Nome do cliente</label>
			    <input type="text" class="form-control" id="nomeCliente" name = "nomeCliente" th:field="*{nomeCliente}">
			</div>
			
			<div class="mb-3">
				<label for="exampleInputClienteDesde" class="form-label">Cliente desde: </label>
				<input type="date" class="form-control" id="dataCriacao" aria-describedby="datalHelp" name="dataClienteDesde" th:field="*{dataClienteDesde}">
				<button type="submit" class="btn btn-primary">Submit</button>
			</div>
		</form>
		<div>&copy; 2026 modelo estático</div>

	</body>
</html>
