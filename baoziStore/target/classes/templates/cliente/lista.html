<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Listagem de clientes</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
		<link rel="stylesheet" type="text/css" media="all" href="../../../css/style.css" />
		<script src="/webjars/jquery/3.5.1/jquery.slim.min.js"></script>
		<script	src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
		<script src="/webjars/bootstrap/4.5.2/js/bootstrap.min.js"></script>

	</head>
	<body>

		<h1>Lista de Clientes</h1>
		<div th:replace="fragments/alert"></div>
		<table>
			<thead>
				<tr>
					<th>Identificação do Cliente</th>
					<th>Nome do Cliente</th>
					<th>Cliente Desde a Data</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="cliente : ${cliente}">
					<td >1</td>
					<td >Jessica</td>
					<td >15/08/2024</td>
					<td colspan="2">
						<a class="btn btn-info btn-sm" role="button">
							<span class="oi oi-brush" title="Editar" aria-hidden="true">Editar</span>
						</a>
						<a class="btn btn-info btn-sm"	 role="button">
							<span class="oi oi-brush" title="Excluir" aria-hidden="true">Excluir</span>
						</a>
					</td>
				</tr>
			</tbody>
		</table>

		<p><a href="../">Return to home</a></p>
	
		<div >&copy; 2026 modelo estático</div>

	</body>

</html>
